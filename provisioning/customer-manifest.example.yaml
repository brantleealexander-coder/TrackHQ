# TrackHQ tenant manifest — reference example.
#
# `provisioning/seed-tenant.ts` reads the `initial_data` block to seed the
# categories / statuses / locations tables of a tenant's Supabase project.
# `provisioning/provision-customer.ts` reads the entire file to spin up
# GitHub fork + Supabase + Vercel + Railway + VAPI and emit a runbook for
# the manual steps that remain.

slug: acme-excavators
business_name: Acme Excavators

# Phase 1 branding (NEXT_PUBLIC_TENANT_CONFIG_JSON values)
brand_color: "#1e40af"
logo_url: https://example.com/acme-logo.png
site_title: Acme Fleet Dashboard

# Used by Phase 4 to generate the receptionist business_config.json
contact:
  phone: "+15551234567"
  email: contact@acme.com
  website: https://acmeexcavators.example.com

# Toggles for the TenantConfig.features block
features:
  visionlink: false
  samsara: true
  quickbooks: true
  chatbot: true

# AI receptionist config. All fields optional — defaults below are used when
# omitted. transfer_phone defaults to `contact.phone`. Phase 4d uses these
# to render the VAPI assistant config; the operator can later refine
# template-server/app/business_config.json on the deployed Railway service.
receptionist:
  name: Alex                          # default: "Alex"
  voice_provider: 11labs              # default: "11labs"
  voice_id: 21m00Tcm4TlvDq8ikWAM      # default: 11labs "Rachel"
  timezone: America/Chicago           # default: "America/Chicago"
  first_message: null                 # default: "Thank you for calling <business>, how can I help you today?"
  transfer_phone: null                # default: contact.phone
  transfer_message: null              # default: "One moment, I'll connect you with the team."

# Phase 4: per-customer overrides for provisioning. Anything left out falls
# back to the DEFAULT_* values in provisioning/.env.
provisioning:
  # GitHub owner (user or org) that will own the per-customer fork of TrackHQ.
  github_owner: null
  # Supabase organization to host this tenant's project in.
  supabase_org_id: null
  # Supabase region. See: https://supabase.com/docs/guides/platform/regions
  supabase_region: null
  # Vercel team (null = personal account).
  vercel_team_id: null
  # Railway team (null = personal account).
  railway_team_id: null
  # Public domain to attach. null = use Vercel-assigned *.vercel.app for now;
  # the runbook will include DNS instructions.
  domain: null
  # Hint for the Twilio number-purchase step in the generated runbook.
  twilio_area_code: null

initial_data:
  # Asset categories — surface as the "Category" dropdown across the dashboard.
  categories:
    - Excavators
    - Loaders
    - Trailers
    - Skid Steers
    - Attachments

  # Statuses — `behavior` must be one of:
  #   rented | available | out_of_service | reserved | pending_return
  # The app switches on behavior, so customers can rename statuses
  # ("On Rent" vs. "Leased") without breaking revenue / utilization logic.
  statuses:
    - { key: on_rent,          name: "On Rent",     color: "#22c55e", behavior: rented,         sort_order: 10 }
    - { key: available,        name: "Available",   color: "#3b82f6", behavior: available,      sort_order: 20 }
    - { key: reserved,         name: "Reserved",    color: "#f59e0b", behavior: reserved,       sort_order: 30 }
    - { key: in_shop,          name: "In Shop",     color: "#f97316", behavior: out_of_service, sort_order: 40 }
    - { key: down,             name: "Down",        color: "#ef4444", behavior: out_of_service, sort_order: 50 }
    - { key: off_rent_pending, name: "Off Rent (Pending Return)", color: "#6b7280", behavior: pending_return, sort_order: 60 }

  # Locations — equipment.home_location_id references these. Coordinates
  # are used as the map fallback when a unit has no VisionLink GPS and no
  # manually entered current_lat/current_lng.
  locations:
    - { name: "Main Yard", address: "1234 Main St, Dallas, TX 75201", latitude: 32.7767, longitude: -96.7970 }
    - { name: "North Lot", address: "500 Industrial Blvd, Plano, TX 75074", latitude: 33.0198, longitude: -96.6989 }
