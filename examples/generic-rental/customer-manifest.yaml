# Generic Rental — the default demo manifest for dev-bootstrap.
#
# Models a mixed-vertical rental business (heavy equipment + boats +
# event rentals + cars) so localhost demos look right for any prospect
# walking through TrackHQ, not just a heavy-equipment-only shop.
#
# Crossmar's vertical-specific manifest is still callable via
# `npm run dev-bootstrap --manifest=examples/crossmar/customer-manifest.yaml`.

slug: generic-rental
business_name: Sunset Rentals
brand_color: "#1e40af"
logo_url: ""
site_title: "Sunset Rentals"

contact:
  phone: "+15125550100"
  email: hello@sunsetrentals.example
  website: https://sunsetrentals.example

features:
  visionlink: false
  samsara: false
  quickbooks: false
  chatbot: false

provisioning:
  github_owner: null
  supabase_org_id: null
  supabase_region: null
  vercel_team_id: null
  railway_team_id: null
  domain: null
  twilio_area_code: "512"

initial_data:
  categories:
    - Heavy Equipment
    - Watercraft
    - Event Rentals
    - Vehicles

  statuses:
    - { key: on_rent,    name: "On Rent",        color: "#22c55e", behavior: rented,         sort_order: 10 }
    - { key: available,  name: "Available",      color: "#3b82f6", behavior: available,      sort_order: 20 }
    - { key: reserved,   name: "Reserved",       color: "#f59e0b", behavior: reserved,       sort_order: 30 }
    - { key: in_service, name: "In Maintenance", color: "#f97316", behavior: out_of_service, sort_order: 40 }
    - { key: down,       name: "Down",           color: "#ef4444", behavior: out_of_service, sort_order: 50 }

  locations:
    - { name: "Main Yard",  address: "100 Lakeside Dr, Austin, TX 78701",  latitude: 30.2672, longitude: -97.7431 }
    - { name: "South Lot",  address: "550 Riverside Way, San Marcos, TX 78666", latitude: 29.8833, longitude: -97.9414 }

